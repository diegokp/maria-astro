<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Maria Dimitropoulou López — Ανανέωση ιστοσελίδας</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css?display=swap&family=Roboto:300,400|Roboto+Mono:300,400" rel="stylesheet">
<style>

  /* ==========================================================
     PALETA Y TIPOGRAFÍA — tomadas del sitio original
     (mariadimitropouloulopez.com): mostaza del logo, crema de
     fondo de sección, verde salvia y coral de acentos, y la
     fuente manuscrita "Mandy's Sketch" usada en sus titulares.
     ========================================================== */
  @font-face {
    font-family: "Mandys Sketch";
    src: url("fonts/MandysSketch.ttf") format("truetype");
    font-display: swap;
  }

  :root {
    --color-bg: #EFEAE4;         /* crema, igual que las secciones del sitio */
    --color-mustard: #F8CD7E;    /* mostaza del fondo del logo */
    --color-mustard-soft: rgba(248, 205, 126, 0.35);
    --color-teal: #D2EAEA;       /* menta, acento secundario del sitio */
    --color-ink: #525252;        /* carbón, texto principal del sitio */
    --color-ink-soft: rgba(58, 58, 58, 0.66);
    --color-coral: #E47869;      /* acento coral del sitio */
    --color-green: #7A8C38;      /* acento verde del sitio */
    --color-line: rgba(58, 58, 58, 0.15);

    --font-display: "Mandys Sketch", cursive;
    --font-body: "Roboto", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "Roboto Mono", "SFMono-Regular", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-weight: 300;
    min-height: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    min-height: 100vh;
    padding: 0;
  }

  .site-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.5rem 4rem;
  }

  .wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 1.5rem;
    max-width: 34rem;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
    text-align: center;
  }

  .logo {
    width: 122px;
    height: auto;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2rem, 5.5vw, 3rem);
    line-height: 1.3;
    margin: 0 0 0.8rem;
    color: var(--color-ink);
  }

  .lede {
    font-size: 1.05rem;
    line-height: 1.6;
    color: var(--color-ink-soft);
    margin: 0 0 1.8rem;
  }

  .contact {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-bottom: 1.8rem;
  }

  .contact a {
    font-family: var(--font-mono);
    color: var(--color-ink);
    text-decoration: none;
    font-size: 0.95rem;
    border-bottom: 1px solid var(--color-line);
    padding-bottom: 2px;
    transition: border-color 0.2s ease, color 0.2s ease;
  }

  .contact a:hover,
  .contact a:focus-visible {
    color: var(--color-coral);
    border-color: var(--color-coral);
  }

  .social {
    display: flex;
    gap: 0.7rem;
  }

  .social a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--color-mustard);
    color: #fff;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .social a:hover,
  .social a:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(58, 58, 58, 0.18);
  }

  .social svg { width: 20px; height: 20px; fill: currentColor; }

  footer {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--color-ink-soft);
    opacity: 0.8;
  }

  a:focus-visible, .social a:focus-visible {
    outline: 2px solid var(--color-coral);
    outline-offset: 2px;
  }

</style>
</head>
<body>

  <header class="site-header">
    <img class="logo" src="images/maria-dimitropoulou-logo.png" alt="Maria Dimitropoulou López">

      </a>
      <a href="https://www.linkedin.com/in/maria-dimitropoulou-lopez-53268375/" aria-label="LinkedIn" target="_blank" rel="noopener">

      </a>
    </div>
  </header>

  <main class="wrap">
    <h1>Ανανεώνουμε αυτόν τον χώρο</h1>
    <p class="lede">Σύντομα θα είμαστε ξανά εδώ.</p>

    <div class="contact">
      <a href="mailto:dimitropoulou.mar@gmail.com">dimitropoulou.mar@gmail.com</a>
    </div>

    <footer>© <span id="y"></span> Maria Dimitropoulou López.</footer>
  </main>

  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
